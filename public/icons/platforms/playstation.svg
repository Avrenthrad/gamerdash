<!-- Official PlayStation brand mark — raster source supplied by user,
     clipped to the same 48×48 rounded-square frame as Steam/Xbox. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="PlayStation">
  <defs>
    <clipPath id="ps-icon-round">
      <rect width="48" height="48" rx="12" />
    </clipPath>
  </defs>
  <image
    href="playstation.png"
    width="48"
    height="48"
    clip-path="url(#ps-icon-round)"
    preserveAspectRatio="xMidYMid meet"
  />
</svg>
