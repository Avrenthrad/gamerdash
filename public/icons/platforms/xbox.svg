<!-- Not sourced from Simple Icons (they don't carry a Microsoft Xbox
     mark). A simplified stylization of the real Xbox sphere logo
     (white circle + green crossing bands) rather than an attempt at
     its precise tapered wing/shield geometry — two earlier freehand
     attempts at that came out unrecognizable (a tribal-mask shape,
     not Xbox), so this trades some fidelity for a shape guaranteed to
     actually render as a clean, recognizable circle-and-X. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Xbox">
  <rect width="48" height="48" rx="12" fill="#107C10"/>
  <circle cx="24" cy="24" r="14" fill="#fff"/>
  <g stroke="#107C10" stroke-width="5.5" stroke-linecap="round">
    <path d="M15 15 L33 33" fill="none"/>
    <path d="M33 15 L15 33" fill="none"/>
  </g>
</svg>
